<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en" xml:lang="en" style="height:100%">
    <head>
        <title>MetExplore Visualization</title>
        <meta http-equiv="content-type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
        <link href="resources/icons/favicon.ico" type="image/x-icon" rel="shortcut icon"/>

        <!-- <script  id="microloader" data-app="c2a09d62-4072-4cd8-93fd-00718ff8a8f2" src="bootstrap.js"></script>  -->

        <script id="microloader" type="text/javascript" src="bootstrap.js"></script>
        <!-- The line below must be kept intact for Sencha Cmd to build your application -->

        <script type="text/javascript">

            function init(){
                function whileMetExploreVizNotLoading(func){
                    this.reloadMetexploreViz(func);
                }

                // Avoid scrolling when visualisation is panning
                var style = parent.document.createElement('style');
                document.head.appendChild(style);
                style.sheet.insertRule('.stop-scrolling {overflow: hidden;}');
                style.sheet.insertRule('body {overflow: overlay;}');


                if(parent.document.getElementById('iFrameMetExploreViz')!=null){
                    var dimensionIFrameMetExploreViz = parent.document.getElementById('iFrameMetExploreViz').getBoundingClientRect();

                    document.getElementById("visualisation").style.width = dimensionIFrameMetExploreViz.width+"px";
                    document.getElementById("visualisation").style.height = dimensionIFrameMetExploreViz.height+"px";
                }
                // Launch metExploreViz after microloader loading


                // Ext.Microloader.onAllUpdatedAssetsReady = function(){
                //     Ext.onReady(function() {
                //         var visu = new metExploreViz('visualisation', parent);
                //         // Create metExploreViz variable in parent DOM
                //         parent.metExploreViz = metExploreD3;
                //     });
                // };

                Ext.Microloader.checkAllUpdates = function(){
                    Ext.onReady(function() {
                        var visu = new metExploreViz('visualisation', parent);
                        // Create metExploreViz variable in parent DOM
                        parent.metExploreViz = metExploreD3;
                    });
                };

                fetch('http://127.0.0.1:8000/model_flux.csv').then(response => {
                            return response.text();
                        }).then(flux_data => {
                            let lines = flux_data.split("\n");
                            lines.shift();
                            lines = lines.filter(element => {
                              return element !== "";
                            });

                            let data = [];
                            let sdData = [];
                            lines.map(function (item){
                                let element = item.split("\t");
                                let identifier = element[0];
                                let d = element[1];
                                let flux_value = d.replace(",",".");
                                data.push([identifier, flux_value]);
                                sdData.push([identifier]);
                            });
                            let flux_tmp = new Flux(
                                "Flux",
                                ["Flux"],
                                "reactionId",
                                [],
                            );

                            flux_tmp.data = data;
                            flux_tmp.sdData = sdData;
                            flux_tmp.sdConditions = [];

                            _metExploreViz.addFlux(flux_tmp);
                            metExploreD3.fireEvent("fluxMapping","fileParse");
                            metExploreD3.fireEvent("fluxMapping","fileLoad");
                            console.log("Loading flux finished")
                        });

                fetch('http://127.0.0.1:8000/model.json').then(response => {
                  return response.text();
                }).then(data => {
                    metExploreViz.GraphPanel.refreshPanel(data, function() {
                        metExploreViz.onloadSession(function(){
                           fetch('http://127.0.0.1:8000/side_metabolites.txt').then(response => {
                              return response.text();
                            }).then(data => {
                                data = data.replace(/\r/g, "")
                                let sideCompounds = data.split('\n');
                                console.log(sideCompounds);
                                let success = metExploreD3.GraphNode.loadSideCompounds(
                                    sideCompounds
                                );
                                console.log(`Loading of sideCompounds: ${success}`);

                            })
                        });
                    });
                    console.log("Loading data finished")
                })
                console.log("Loading data finished 2")





            }
            document.addEventListener("DOMContentLoaded", init, false);



        </script>
    </head>

    <body style="height:100%">
        <div id ="visualisation" style="height:100%; width:100%;">
        </div>
    </body>
</html>
