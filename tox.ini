[tox]
# Environments are created by uv (see tox-uv), which supplies the CPython
# versions below. Depending on uv's "python-downloads" setting they may have
# to be fetched once via "uv python install" -- see README.md, "Development".
requires =
    tox>=4.21
    tox-uv>=1.16
envlist = format,lint,types,py39,py310,py311,py312,py313,py310-req

[testenv]
deps = pytest
commands = pytest {posargs}

[testenv:py310-req]
# Reproducibility check: installs the pinned lockfile instead of resolving
# dependencies fresh. The pins were compiled with Python 3.10 and only work
# there, so this env stays on 3.10 while [testenv] covers the version matrix.
deps =
    pytest
    -r requirements.txt
commands = pytest {posargs}

[testenv:format]
skip_install = True
deps =
    black
commands =
    black src/cobra2d/ tests/ --line-length=79 --diff --check

[testenv:lint]
skip_install = True
deps =
    flake8
commands =
    flake8 src/cobra2d/ tests/

[testenv:types]
deps =
    mypy
commands =
    mypy src/cobra2d/ tests/
