[tox]
# use tox-conda if you want to use the locally installed conda environments
# requires = tox-conda
envlist = format,lint,types,py37,py38,py39
isolated_build = True

[testenv]
download = true
deps = pytest
commands = pytest {posargs}


[testenv:format]
skip_install = True
deps =
    black
commands =
    black src/model_duplication/ tests/ --line-length=79 --diff --check

[testenv:lint]
skip_install = True
deps =
    flake8
commands =
    flake8 src/model_duplication/ tests/

[testenv:types]
deps =
    mypy
commands =
    mypy src/cobramod/ tests/